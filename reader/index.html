<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reader</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root {
    --bg: #fbfaf7;
    --fg: #1d1c1a;
    --muted: #8a867e;
    --rule: #dcd8cf;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1a1a19; --fg: #d9d6cf; --muted: #7d7a73; --rule: #3a3936; }
  }
  html { background: var(--bg); color: var(--fg); }
  body {
    margin: 0;
    font: 19px/1.6 Charter, "Iowan Old Style", Georgia, serif;
  }
  #drop {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    color: var(--muted); font-family: system-ui, sans-serif; font-size: 15px;
    text-align: center;
  }
  #drop[hidden] { display: none; }
  #drop.over { background: color-mix(in srgb, var(--fg) 6%, transparent); }
  #drop label { text-decoration: underline; cursor: pointer; }
  #drop input { display: none; }
  #book { max-width: 34em; margin: 0 auto; padding: 4em 1.25em 40vh; }
  #book:empty { display: none; }

  /* Skip layout and paint for chapters far off screen. 12000px is roughly an
     average chapter; `auto` remembers each one's real height once rendered. */
  #book section { content-visibility: auto; contain-intrinsic-block-size: auto 12000px; }

  /* Book content: our typography, not the publisher's */
  #book section + section { border-top: 1px solid var(--rule); margin-top: 4em; padding-top: 4em; }
  #book p { margin: 0; text-indent: 1.5em; }
  #book p:first-child, #book section > p:first-of-type, #book h1 + p, #book h2 + p, #book h3 + p, #book hr + p { text-indent: 0; }
  #book h1, #book h2, #book h3 { line-height: 1.25; margin: 1.5em 0 1em; text-align: center; }
  #book img, #book svg { max-width: 100%; height: auto; display: block; margin: 1em auto; }
  #book a { color: inherit; }
  #book blockquote { margin: 1em 2em; }
  #book .center, #book [align="center"] { text-align: center; text-indent: 0; }
</style>
</head>
<body>
<div id="drop">
  <div>Drop an .epub here, or <label>choose one<input type="file" accept=".epub,application/epub+zip"></label></div>
</div>
<main id="book"></main>

<script>
const drop = document.getElementById('drop');
const bookEl = document.getElementById('book');
const XLINK = 'http://www.w3.org/1999/xlink';
let currentKey = null;
let blobUrls = [];

// --- File input / drag and drop ---------------------------------------------

function onFile(file) {
  if (!file) return;
  openBook(file).catch(err => {
    console.error(err);
    alert('Could not open that file as an EPUB.');
  });
}

drop.querySelector('input').addEventListener('change', e => onFile(e.target.files[0]));
addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
addEventListener('dragleave', e => { if (!e.relatedTarget) drop.classList.remove('over'); });
addEventListener('drop', e => {
  e.preventDefault();
  drop.classList.remove('over');
  onFile(e.dataTransfer.files[0]);
});

// --- Path helpers ------------------------------------------------------------

function dirname(path) {
  const i = path.lastIndexOf('/');
  return i === -1 ? '' : path.slice(0, i + 1);
}

// Resolve `rel` against directory `dir`, both zip-internal. Returns {path, hash}.
function resolve(dir, rel) {
  const [pathPart, hash = ''] = rel.split('#');
  const parts = (dir + decodeURIComponent(pathPart)).split('/');
  const out = [];
  for (const p of parts) {
    if (p === '..') out.pop();
    else if (p !== '.' && p !== '') out.push(p);
  }
  return { path: out.join('/'), hash };
}

const isExternal = href => /^[a-z][a-z0-9+.-]*:/i.test(href);

// --- Loading -----------------------------------------------------------------

// container.xml -> OPF -> metadata, reading order and media types.
async function readPackage(zip) {
  const xml = async path =>
    new DOMParser().parseFromString(await zip.file(path).async('text'), 'application/xml');

  const container = await xml('META-INF/container.xml');
  const opfPath = container.querySelector('rootfile').getAttribute('full-path');
  const opf = await xml(opfPath);

  const pathById = new Map();
  const typeByPath = new Map();
  for (const item of opf.querySelectorAll('manifest > item')) {
    const { path } = resolve(dirname(opfPath), item.getAttribute('href'));
    pathById.set(item.getAttribute('id'), path);
    typeByPath.set(path, item.getAttribute('media-type'));
  }
  const spine = [...opf.querySelectorAll('spine > itemref')]
    .filter(ref => ref.getAttribute('linear') !== 'no')
    .map(ref => pathById.get(ref.getAttribute('idref')))
    .filter(Boolean);

  const meta = name => opf.getElementsByTagNameNS('*', name)[0]?.textContent.trim();
  return { title: meta('title'), identifier: meta('identifier'), spine, typeByPath };
}

async function openBook(file) {
  const zip = await JSZip.loadAsync(file);
  const { title, identifier, spine, typeByPath } = await readPackage(zip);

  // Each zip resource gets one blob URL, created on first use.
  blobUrls.forEach(URL.revokeObjectURL);
  blobUrls = [];
  const blobCache = new Map();
  const blobUrl = path => {
    if (!blobCache.has(path)) {
      const entry = zip.file(path);
      blobCache.set(path, entry
        ? entry.async('uint8array').then(bytes => {
            const url = URL.createObjectURL(new Blob([bytes], { type: typeByPath.get(path) || '' }));
            blobUrls.push(url);
            return url;
          })
        : Promise.resolve(''));
    }
    return blobCache.get(path);
  };

  // Section index per spine path, so cross-file links can become in-page anchors.
  const sectionOf = new Map(spine.map((path, i) => [path, i]));

  const fragment = document.createDocumentFragment();
  const pending = [];

  for (const [i, chapterPath] of spine.entries()) {
    const entry = zip.file(chapterPath);
    if (!entry) continue;
    const text = await entry.async('text');

    let doc = new DOMParser().parseFromString(text, 'application/xhtml+xml');
    if (doc.querySelector('parsererror')) doc = new DOMParser().parseFromString(text, 'text/html');

    const dir = dirname(chapterPath);
    const body = doc.body || doc.getElementsByTagName('body')[0];
    if (!body) continue;

    const section = document.createElement('section');
    section.id = `s${i}`;
    for (const node of [...body.childNodes]) section.appendChild(document.importNode(node, true));

    section.querySelectorAll('script, style, link, meta').forEach(el => el.remove());
    section.querySelectorAll('[style]').forEach(el => el.removeAttribute('style'));
    // Drop headings with no text (e.g. untitled chapters), keeping any anchors' ids.
    section.querySelectorAll('h1, h2, h3, h4, h5, h6').forEach(h => {
      if (!h.textContent.trim() && !h.querySelector('img, svg')) {
        const span = document.createElement('span');
        if (h.id) span.id = h.id;
        h.replaceWith(span, ...h.querySelectorAll('[id]'));
      }
    });

    // Prefix ids so they stay unique across chapters.
    section.querySelectorAll('[id]').forEach(el => { el.id = `s${i}-${el.id}`; });

    // Images (HTML <img src> and SVG <image href>) -> blob URLs from the zip.
    // The relative URL is removed first so the browser doesn't try to fetch it.
    for (const img of section.querySelectorAll('img, image')) {
      const attr = img.localName === 'img' ? 'src' : 'href';
      const src = img.getAttribute(attr) || img.getAttributeNS(XLINK, 'href');
      if (!src || isExternal(src)) continue;
      img.removeAttribute(attr);
      img.removeAttributeNS(XLINK, 'href');
      pending.push(blobUrl(resolve(dir, src).path).then(url => img.setAttribute(attr, url)));
    }

    // Links: same-book -> in-page anchors, external -> new tab.
    for (const a of section.querySelectorAll('a[href]')) {
      const href = a.getAttribute('href');
      if (isExternal(href)) { a.target = '_blank'; a.rel = 'noopener'; continue; }
      const { path, hash } = href.startsWith('#') ? { path: chapterPath, hash: href.slice(1) } : resolve(dir, href);
      const target = sectionOf.get(path);
      if (target === undefined) { a.removeAttribute('href'); continue; }
      a.setAttribute('href', hash ? `#s${target}-${hash}` : `#s${target}`);
    }

    fragment.appendChild(section);
  }

  await Promise.all(pending);

  // Stop saving positions until the new book's position is restored, or the
  // scroll caused by swapping content would overwrite the previous book's.
  currentKey = null;
  bookEl.replaceChildren(fragment);
  document.title = title || file.name;
  drop.hidden = true;

  // Wait for images to have their real size before restoring the position.
  await Promise.all([...bookEl.querySelectorAll('img')].map(img => img.decode().catch(() => {})));
  currentKey = `reader:pos:${identifier || file.name}`;
  restorePosition();
}

// --- Reading position --------------------------------------------------------
// Stored as (section index, fraction through that section) so it survives
// changes in window width and font size.

function savePosition() {
  if (!currentKey) return;
  const sections = bookEl.children;
  for (let i = 0; i < sections.length; i++) {
    const rect = sections[i].getBoundingClientRect();
    if (rect.bottom > 0) {
      const fraction = Math.max(0, -rect.top) / rect.height;
      try { localStorage.setItem(currentKey, JSON.stringify({ i, fraction })); } catch {}
      return;
    }
  }
}

// Sections far off screen have placeholder heights (content-visibility), so
// scroll to the section first, let it and its neighbours render, then apply the
// fraction against real heights. Repeat until the target stops moving.
async function restorePosition() {
  let pos = null;
  try { pos = JSON.parse(localStorage.getItem(currentKey)); } catch {}
  const section = pos && bookEl.children[pos.i];
  if (!section) { scrollTo(0, 0); return; }
  const nextFrame = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  let target = section.offsetTop;
  for (let tries = 0; tries < 5; tries++) {
    scrollTo(0, target);
    await nextFrame();
    const next = Math.round(section.offsetTop + pos.fraction * section.offsetHeight);
    if (Math.abs(next - scrollY) < 2) break;
    target = next;
  }
}

let saveTimer;
addEventListener('scroll', () => {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(savePosition, 200);
}, { passive: true });
addEventListener('pagehide', savePosition);
</script>
</body>
</html>
